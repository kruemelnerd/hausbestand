services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heizinventur
      POSTGRES_USER: heizinventur
      POSTGRES_PASSWORD: heizinventur
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:

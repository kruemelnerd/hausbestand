services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heizinventur
      POSTGRES_USER: heizinventur
      POSTGRES_PASSWORD: heizinventur
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
